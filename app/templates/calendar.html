<!DOCTYPE html>
<html lang="ro" data-theme="dark">
<head>
<meta charset="UTF-8">
<script>(function(){document.documentElement.setAttribute('data-theme',localStorage.getItem('nexas-theme')||'dark');})()</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendar Interviuri — NEXAS HR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'DM Sans',sans-serif;font-size:14px;color:#fff;min-height:100vh;
  background:
    radial-gradient(circle at 10% 8%,rgba(93,169,255,.14),transparent 34%),
    radial-gradient(circle at 88% 85%,rgba(34,199,184,.08),transparent 30%),
    linear-gradient(135deg,#121827,#171f33 50%,#1d263d);
}
:root{
  --bg:#141b2d;--s1:#1a2238;--s2:#202a44;--card:#1c2540;
  --line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.14);
  --soft:rgba(255,255,255,.82);--muted:rgba(255,255,255,.50);
  --blue:#5da9ff;--b2:#7cc4ff;--bsoft:rgba(93,169,255,.13);--bline:rgba(93,169,255,.26);
  --teal:#22c7b8;--t2:#5ee6da;--tsoft:rgba(34,199,184,.13);--tline:rgba(34,199,184,.26);
  --yellow:#f59e0b;--ysoft:rgba(245,158,11,.13);--yline:rgba(245,158,11,.26);
  --red:#ff6b70;--rsoft:rgba(255,107,112,.13);--rline:rgba(255,107,112,.26);
  /* Aliases for files that used different names */
  --purple:var(--blue);--purple-2:var(--b2);
  --green:var(--teal);--green-2:var(--tsoft);
  --surface:var(--s1);--surface-2:var(--s2);
  --r:12px;--rl:18px;--rxl:22px;
  --radius-md:12px;--radius-lg:18px;--radius-xl:22px;
  --radius-sm:9px;
}
/* ── LAYOUT ── */
.layout{display:flex;min-height:100vh}
.sidebar{
  width:220px;position:fixed;top:0;bottom:0;left:0;z-index:20;
  background:linear-gradient(180deg,#101825,#141b2d);
  border-right:1px solid var(--line);
  display:flex;flex-direction:column;
}
.brand,.sidebar-logo{padding:24px 20px 20px;border-bottom:1px solid var(--line)}
.brand-main,.logo-text{font-family:'Syne',sans-serif;font-size:20px;font-weight:800;color:#fff;letter-spacing:-.3px;line-height:1}
.brand-main span,.logo-text .accent{color:var(--b2)}
.brand-sub,.logo-sub{font-size:10px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-top:5px}
.nav{display:flex;flex-direction:column;gap:2px;padding:12px 10px;flex:1}
.nav a{
  display:flex;align-items:center;gap:9px;padding:10px 12px;
  border-radius:10px;font-size:13px;font-weight:700;color:var(--muted);
  text-decoration:none;transition:.15s;position:relative;user-select:none;
}
.nav a svg{width:15px;height:15px;opacity:.65;flex-shrink:0;transition:.15s}
.nav a:hover{color:#fff;background:rgba(255,255,255,.055)}
.nav a:hover svg{opacity:1}
.nav a.active{color:#fff;background:rgba(93,169,255,.15)}
.nav a.active svg{opacity:1;color:var(--b2)}
.nav a.active::before{
  content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:3px;height:55%;border-radius:0 3px 3px 0;background:var(--b2);
}
.nav a.logout-link{color:rgba(252,165,165,.72);margin-top:auto}
.nav a.logout-link:hover{color:#fca5a5;background:rgba(248,113,113,.08)}
.main{
  margin-left:220px;width:calc(100% - 220px);min-height:100vh;
  padding:26px 28px 36px;
}
/* ── TYPOGRAPHY ── */
.eyebrow{font-size:10px;font-weight:900;color:var(--b2);text-transform:uppercase;letter-spacing:.16em;margin-bottom:7px}
h1,.page-title,.hero-title{font-family:'Syne',sans-serif;font-size:26px;font-weight:800;color:#fff;letter-spacing:-.4px;line-height:1.1;margin-bottom:5px}
.page-sub,.hero-sub,.section-sub,.subtitle{font-size:13px;color:var(--soft);line-height:1.55}
.section-title{font-family:'Syne',sans-serif;font-size:15px;font-weight:800;color:#fff;letter-spacing:-.2px}
.section-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px}
/* ── STAT CARDS ── */
.stats-row,.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}
.stat-card,.kpi{
  background:var(--s1);border:1px solid var(--line);border-radius:var(--rxl);
  padding:16px 18px;position:relative;overflow:hidden;transition:.18s;
}
.stat-card::after,.kpi::after{
  content:'';position:absolute;inset:0;
  background:radial-gradient(circle at top right,rgba(93,169,255,.055),transparent 55%);
  pointer-events:none;
}
.stat-card:hover,.kpi:hover{border-color:var(--bline)}
.stat-label,.kpi-lbl{font-size:10px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:7px}
.stat-value,.kpi-val,.stat-num{font-family:'Syne',sans-serif;font-size:28px;font-weight:800;color:#fff;line-height:1}
.stat-value span,.kpi-val span{font-size:12px;font-weight:700;color:var(--b2);font-family:'DM Sans',sans-serif}
.stat-help,.kpi-note{font-size:10px;color:var(--muted);margin-top:4px}
/* ── CARDS / PANELS ── */
.card,.panel{background:var(--s1);border:1px solid var(--line);border-radius:var(--rxl);padding:20px}
.card-title,.panel-title{font-size:11px;font-weight:900;color:var(--b2);text-transform:uppercase;letter-spacing:.13em;margin-bottom:13px;padding-bottom:10px;border-bottom:1px solid var(--line)}
/* ── BUTTONS ── */
.btn,button[class^="btn"]{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:9px 16px;border-radius:11px;font-size:13px;font-weight:800;
  border:none;cursor:pointer;transition:.15s;font-family:'DM Sans',sans-serif;
  text-decoration:none;white-space:nowrap;
}
.btn:hover{transform:translateY(-1px)}
.btn-primary,.btn-main,.btn-gmail,.btn-save-blue,.btn-details,.btn-blue{
  background:linear-gradient(135deg,var(--blue),var(--b2));color:#07111f;
  box-shadow:0 4px 14px rgba(93,169,255,.22);
}
.btn-primary:hover,.btn-main:hover,.btn-gmail:hover,.btn-save-blue:hover,.btn-blue:hover{box-shadow:0 8px 22px rgba(93,169,255,.32)}
.btn-secondary,.btn-ghost,.btn-edit,.btn-edit-sm,.btn-link,.btn-clear,.btn-export,.btn-nav,.btn-today{
  background:rgba(255,255,255,.06);border:1px solid var(--line2);color:var(--soft);
}
.btn-secondary:hover,.btn-ghost:hover,.btn-edit:hover,.btn-link:hover,.btn-clear:hover,.btn-export:hover,.btn-nav:hover,.btn-today:hover{
  color:#fff;border-color:var(--bline);background:var(--bsoft);
}
.btn-danger,.btn-exclude{background:var(--rsoft);border:1px solid var(--rline);color:#ffb4b7}
.btn-danger:hover,.btn-exclude:hover{background:rgba(255,107,112,.22)}
.btn-cv,.btn-potential,.btn-save-green,.btn-hire,.btn-email,.btn-detail-cand{
  background:var(--tsoft);border:1px solid var(--tline);color:var(--t2);
}
.btn-cv:hover,.btn-potential:hover,.btn-save-green:hover,.btn-hire:hover,.btn-email:hover,.btn-detail-cand:hover{background:rgba(34,199,184,.22)}
.btn-detail,.btn-detail-delete{background:var(--rsoft);border:1px solid var(--rline);color:#ffb4b7}
/* ── TAGS / BADGES ── */
.tag,.status-badge,.tag-chip,.chip,.row-badge{
  display:inline-flex;align-items:center;padding:3px 9px;border-radius:999px;
  font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.06em;
}
.tag-green,.ok,.score-cell.good,.score-circle.score-green,.avatar-top,.count-top{background:var(--tsoft);border:1px solid var(--tline);color:var(--t2)}
.tag-yellow,.score-cell.mid,.score-circle.score-yellow,.avatar-potential,.count-potential{background:var(--ysoft);border:1px solid var(--yline);color:#fcd38a}
.tag-red,.err,.score-circle.score-red,.count-rest{background:var(--rsoft);border:1px solid var(--rline);color:#ffb4b7}
.tag-blue,.head-pill,.top-pill{background:var(--bsoft);border:1px solid var(--bline);color:var(--b2)}
.tag-muted,.tag-chip{background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--soft)}
/* ── AVATARS / SCORES ── */
.avatar,.mini-avatar,.row-avatar,.cand-avatar,.user-avatar{
  display:inline-flex;align-items:center;justify-content:center;border-radius:50%;
  font-family:'Syne',sans-serif;font-weight:800;color:#07111f;flex-shrink:0;
  background:linear-gradient(135deg,var(--teal),var(--blue));
}
.score-num-badge,.score-cell{
  display:inline-flex;align-items:center;justify-content:center;
  width:34px;height:34px;border-radius:50%;font-family:'Syne',sans-serif;font-size:13px;font-weight:800;
}
.score-bar-track,.bar-track{height:6px;background:rgba(255,255,255,.07);border-radius:999px;overflow:hidden}
.score-bar-fill,.bar-fill{height:100%;border-radius:999px}
.sbf-green,.bar-fill.green{background:var(--teal)}
.sbf-yellow,.bar-fill.yellow{background:var(--yellow)}
.sbf-red,.bar-fill.red{background:var(--red)}
.score-wrap{display:flex;flex-direction:column;gap:4px;min-width:60px}
/* ── FORMS / INPUTS ── */
input,select,textarea{
  width:100%;padding:10px 13px;border-radius:11px;border:1px solid var(--line2);
  background:rgba(255,255,255,.06);color:#fff;font-size:14px;font-weight:600;
  outline:none;transition:.18s;font-family:'DM Sans',sans-serif;-webkit-appearance:none;
}
input:focus,select:focus,textarea:focus{border-color:var(--bline);box-shadow:0 0 0 3px rgba(93,169,255,.10)}
input::placeholder,textarea::placeholder{color:rgba(255,255,255,.28)}
select option{background:#1a2238;color:#fff}
textarea{min-height:80px;resize:vertical;line-height:1.5}
.field{margin-bottom:12px}
.field label,label{font-size:10px;font-weight:900;color:var(--b2);text-transform:uppercase;letter-spacing:.12em;display:block;margin-bottom:6px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid .full,.form-grid [class*="full"]{grid-column:1/-1}
.form-line{display:flex;gap:8px;align-items:center}
.form-line input,.form-line select{flex:1}
/* ── MISC SHARED ── */
.message,.notice,.alert{padding:11px 14px;border-radius:11px;font-size:13px;font-weight:700;margin-bottom:12px;background:var(--bsoft);border:1px solid var(--bline);color:var(--b2)}
.err,.error-msg,.danger-box{background:var(--rsoft) !important;border-color:var(--rline) !important;color:#ffb4b7 !important}
.ok-msg{background:var(--tsoft);border:1px solid var(--tline);color:var(--t2)}
.empty,.empty-state,.empty-recommendations,.empty-section,.empty-table{
  text-align:center;padding:40px 20px;color:var(--muted);font-size:13px;
  background:rgba(255,255,255,.02);border:1px dashed var(--line);border-radius:var(--rl);
}
.helper-text,.loading-note{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.5}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.back-btn{
  display:inline-flex;align-items:center;gap:7px;
  font-size:13px;font-weight:700;color:var(--soft);text-decoration:none;
  padding:8px 14px;border-radius:11px;border:1px solid var(--line2);
  background:rgba(255,255,255,.04);transition:.15s;margin-bottom:20px;
}
.back-btn:hover{color:#fff;border-color:var(--bline)}
.danger-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.purple{color:var(--b2)}


/* ── TOPBAR ── */
.topbar{
  height:62px;border-bottom:1px solid var(--line);display:flex;align-items:center;
  padding:0 24px;gap:14px;background:rgba(13,20,36,.92);backdrop-filter:blur(14px);
  position:sticky;top:0;z-index:10;
}
.topbar-title{font-family:'Syne',sans-serif;font-size:17px;font-weight:800;color:#fff;letter-spacing:-.3px;line-height:1.1}
.topbar-sub{font-size:11px;color:var(--soft);margin-top:2px}
.week-nav{display:flex;align-items:center;gap:7px;margin-left:auto}
.week-label{font-size:13px;font-weight:800;color:#fff;min-width:176px;text-align:center}
.btn-nav{width:32px;height:32px;border-radius:9px;border:1px solid var(--line2);background:rgba(255,255,255,.05);color:var(--soft);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
.btn-nav:hover{color:#fff;border-color:var(--bline);background:var(--bsoft)}
.btn-nav svg{width:14px;height:14px}
.btn-today{padding:7px 13px;border-radius:9px;font-size:12px;font-weight:800;background:var(--bsoft);border:1px solid var(--bline);color:var(--b2);cursor:pointer;font-family:'DM Sans',sans-serif;transition:.15s}
.btn-today:hover{background:rgba(93,169,255,.22);color:#fff}
.btn-add-interview{display:flex;align-items:center;gap:7px;padding:8px 15px;border-radius:11px;font-size:12px;font-weight:800;background:linear-gradient(135deg,var(--teal),var(--blue));color:#07111f;border:none;cursor:pointer;box-shadow:0 5px 16px rgba(34,199,184,.22);font-family:'DM Sans',sans-serif;transition:.15s}
.btn-add-interview:hover{transform:translateY(-1px);box-shadow:0 9px 22px rgba(34,199,184,.30)}
.btn-add-interview svg{width:14px;height:14px}
/* ── CAL GRID ── */
.cal-outer{flex:1;overflow-y:auto}
.cal-container{min-width:640px}
.cal-header{display:grid;grid-template-columns:58px repeat(7,1fr);border-bottom:1px solid var(--line);background:rgba(13,20,36,.98);position:sticky;top:0;z-index:9}
.cal-header-empty{border-right:1px solid var(--line)}
.cal-day-header{padding:12px 7px 10px;text-align:center;border-right:1px solid var(--line)}
.cal-day-header:last-child{border-right:none}
.cal-day-name{font-size:9px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.13em}
.cal-day-num{font-family:'Syne',sans-serif;font-size:21px;font-weight:800;color:var(--soft);margin-top:3px;line-height:1}
.cal-day-header.is-today .cal-day-name{color:var(--t2)}
.cal-day-header.is-today .cal-day-num{color:#07111f;background:linear-gradient(135deg,var(--teal),var(--blue));width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:3px auto 0;font-size:15px}
.cal-body{display:grid;grid-template-columns:58px repeat(7,1fr)}
.cal-hours{border-right:1px solid var(--line)}
.cal-hour-label{height:64px;display:flex;align-items:flex-start;justify-content:flex-end;padding:7px 9px 0 0;font-size:10px;font-weight:700;color:var(--muted);border-bottom:1px solid var(--line)}
.cal-day-col{position:relative;border-right:1px solid var(--line);cursor:pointer}
.cal-day-col:last-child{border-right:none}
.cal-day-col.is-today{background:rgba(93,169,255,.025)}
.cal-slot{height:64px;border-bottom:1px solid var(--line);position:relative;transition:background .1s}
.cal-slot:last-child{border-bottom:none}
.cal-slot:hover{background:rgba(93,169,255,.06)}
/* ── MODALS ── */
.modal-overlay{position:fixed;inset:0;z-index:100;background:rgba(7,17,31,.80);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .22s}
.modal-overlay.visible{opacity:1;pointer-events:all}
.modal{background:linear-gradient(145deg,#1a2540,#131c30);border:1px solid var(--line2);border-radius:22px;padding:30px;width:100%;max-width:480px;box-shadow:0 40px 100px rgba(0,0,0,.55);transform:translateY(16px) scale(.97);transition:transform .22s;position:relative}
.modal-overlay.visible .modal{transform:translateY(0) scale(1)}
.modal-close{position:absolute;top:14px;right:14px;width:28px;height:28px;border-radius:50%;border:1px solid var(--line2);background:rgba(255,255,255,.06);color:var(--soft);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;transition:.16s}
.modal-close:hover{color:#fff;background:rgba(255,255,255,.12)}
.modal-title{font-family:'Syne',sans-serif;font-size:19px;font-weight:800;color:#fff;margin-bottom:4px}
.modal-sub{font-size:12px;color:var(--soft);margin-bottom:20px}
.modal-actions{display:flex;gap:9px;margin-top:20px}
.btn-modal-cancel{flex:1;padding:11px;border-radius:12px;font-size:13px;font-weight:800;background:rgba(255,255,255,.06);border:1px solid var(--line2);color:var(--soft);cursor:pointer;font-family:'DM Sans',sans-serif;transition:.15s}
.btn-modal-cancel:hover{color:#fff;background:rgba(255,255,255,.11)}
.btn-modal-save{flex:2;padding:11px;border-radius:12px;font-size:13px;font-weight:800;background:linear-gradient(135deg,var(--teal),var(--blue));border:none;color:#07111f;cursor:pointer;box-shadow:0 5px 16px rgba(34,199,184,.20);font-family:'DM Sans',sans-serif;transition:.15s}
.btn-modal-save:hover{transform:translateY(-1px);box-shadow:0 9px 22px rgba(34,199,184,.28)}
/* Detail popup */
.detail-popup{position:fixed;z-index:200;background:#182036;border:1px solid var(--line2);border-radius:17px;padding:17px;min-width:236px;max-width:288px;box-shadow:0 22px 55px rgba(0,0,0,.48);display:none}
.detail-popup.visible{display:block}
.detail-name{font-size:14px;font-weight:800;color:#fff;margin-bottom:3px}
.detail-job{font-size:11px;color:var(--t2);font-weight:700;margin-bottom:11px}
.detail-row{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--soft);font-weight:600;margin-bottom:6px}
.detail-row svg{width:12px;height:12px;color:var(--b2);flex-shrink:0}
.detail-actions{display:flex;gap:6px;margin-top:12px;padding-top:11px;border-top:1px solid var(--line)}
/* Candidate search dropdown */
.candidate-search-wrap{position:relative}
.candidate-dropdown{position:absolute;top:calc(100% + 5px);left:0;right:0;z-index:20;background:#182036;border:1px solid var(--line2);border-radius:12px;overflow:hidden;box-shadow:0 14px 36px rgba(0,0,0,.32)}
.candidate-option{padding:10px 14px;cursor:pointer;transition:background .12s;font-size:13px;font-weight:600;color:#fff;border-bottom:1px solid var(--line)}
.candidate-option:last-child{border-bottom:none}
.candidate-option:hover{background:rgba(93,169,255,.10);color:var(--b2)}
.opt-job{font-size:11px;color:var(--soft);margin-top:2px}
/* Toast */
.toast{position:fixed;bottom:24px;right:24px;z-index:300;padding:12px 18px;border-radius:13px;font-size:13px;font-weight:800;background:#1a2540;border:1px solid var(--tline);color:var(--t2);box-shadow:0 10px 28px rgba(0,0,0,.38);transform:translateY(18px);opacity:0;transition:.24s;pointer-events:none}
.toast.show{transform:translateY(0);opacity:1}
.toast.error{border-color:var(--rline);color:#ffb4b7}
/* IV cards */
.interview-card{position:absolute;z-index:3;border-radius:9px;padding:5px 7px;overflow:hidden;cursor:pointer;transition:transform .14s;min-height:24px}
.interview-card:hover{transform:translateY(-1px) scale(1.02);z-index:5}
.interview-card.status-programat{background:linear-gradient(135deg,rgba(34,199,184,.88),rgba(74,149,246,.78));border:1px solid rgba(34,199,184,.36);box-shadow:0 3px 12px rgba(34,199,184,.16)}
.interview-card.status-finalizat{background:linear-gradient(135deg,rgba(60,75,110,.80),rgba(45,60,90,.75));border:1px solid rgba(255,255,255,.09)}
.card-time{font-size:9px;font-weight:900;color:rgba(7,17,31,.72);line-height:1;margin-bottom:1px}
.card-name{font-size:10px;font-weight:800;color:#07111f;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-job{font-size:9px;color:rgba(7,17,31,.58);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.interview-card.status-finalizat .card-time,.interview-card.status-finalizat .card-name,.interview-card.status-finalizat .card-job{color:var(--soft)}
.current-time-line{position:absolute;left:0;right:0;height:2px;z-index:4;pointer-events:none;background:linear-gradient(90deg,transparent,var(--teal),transparent)}
.current-time-line::before{content:'';position:absolute;left:-1px;top:50%;transform:translateY(-50%);width:7px;height:7px;border-radius:50%;background:var(--teal);box-shadow:0 0 6px rgba(34,199,184,.55)}


/* ═══ CALENDAR MOBILE ═══ */
@media(max-width:768px){
  .layout{display:flex !important;flex-direction:column !important;height:100dvh !important;height:100vh !important;overflow:hidden !important;padding-bottom:0 !important}
  .sidebar{display:none !important}
  .main{flex:1 !important;display:flex !important;flex-direction:column !important;height:100% !important;overflow:hidden !important;margin-left:0 !important;width:100% !important;padding:0 !important}
  .topbar{flex-shrink:0 !important;padding:0 10px !important;height:54px !important}
  .topbar .week-label{min-width:0 !important;font-size:11px !important}
  .cal-outer{flex:1 !important;overflow:hidden !important}
  .cal-container{min-width:0 !important;height:100% !important;display:flex !important;flex-direction:column !important}
  .cal-header,.cal-body{display:none !important}

<script>
// ── CONFIG ──
const HOUR_START  = 8;   // 08:00
const HOUR_END    = 20;  // 20:00
const HOUR_PX     = 64;  // px per ora
const DAYS_RO     = ['Lun','Mar','Mie','Joi','Vin','Sâm','Dum'];
const MONTHS_RO   = ['Ianuarie','Februarie','Martie','Aprilie','Mai','Iunie','Iulie','August','Septembrie','Octombrie','Noiembrie','Decembrie'];
const MONTHS_SHORT= ['Ian','Feb','Mar','Apr','Mai','Iun','Iul','Aug','Sep','Oct','Nov','Dec'];

// ── STATE ──
let currentWeekStart = getMonday(new Date());
let interviews       = [];
let selectedInterview= null;
let preselectedCandidate = null;
let searchTimeout    = null;

// ── PRESELECTED CANDIDATE (din URL) ──
{% if preselected_candidate %}
preselectedCandidate = {
  id:        {{ preselected_candidate.id }},
  name:      {{ preselected_candidate.name | tojson }},
  email:     {{ (preselected_candidate.email or '') | tojson }},
  job_title: {{ (preselected_candidate.job_title or '') | tojson }},
};
{% endif %}

// ── DATE UTILS ──
function getMonday(d) {
  const date = new Date(d);
  const day  = date.getDay();
  const diff = (day === 0) ? -6 : 1 - day;
  date.setDate(date.getDate() + diff);
  date.setHours(0,0,0,0);
  return date;
}
function dateToStr(d) {
  return d.getFullYear() + '-' +
    String(d.getMonth()+1).padStart(2,'0') + '-' +
    String(d.getDate()).padStart(2,'0');
}
function strToDate(s) {
  const [y,m,d] = s.split('-').map(Number);
  return new Date(y, m-1, d);
}
function formatDateRo(s) {
  const d = strToDate(s);
  return `${d.getDate()} ${MONTHS_RO[d.getMonth()]} ${d.getFullYear()}`;
}
function isToday(d) {
  const t = new Date();
  return d.getDate()===t.getDate() && d.getMonth()===t.getMonth() && d.getFullYear()===t.getFullYear();
}
function addDays(d, n) {
  const r = new Date(d);
  r.setDate(r.getDate() + n);
  return r;
}

// ── RENDER CALENDAR ──
function renderCalendar() {
  const container = document.getElementById('cal-container');
  container.innerHTML = '';

  // header
  const header = document.createElement('div');
  header.className = 'cal-header';
  const emptyCell = document.createElement('div');
  emptyCell.className = 'cal-hour-label cal-header-empty';
  header.appendChild(emptyCell);

  for (let i=0; i<7; i++) {
    const day = addDays(currentWeekStart, i);
    const cell = document.createElement('div');
    cell.className = 'cal-day-header' + (isToday(day) ? ' is-today' : '');
    cell.innerHTML = `<div class="cal-day-name">${DAYS_RO[i]}</div><div class="cal-day-num">${day.getDate()}</div>`;
    header.appendChild(cell);
  }
  container.appendChild(header);

  // body
  const body = document.createElement('div');
  body.className = 'cal-body';

  // hour labels column
  const hoursCol = document.createElement('div');
  hoursCol.className = 'cal-hours';
  for (let h=HOUR_START; h<HOUR_END; h++) {
    const lbl = document.createElement('div');
    lbl.className = 'cal-hour-label';
    lbl.textContent = `${String(h).padStart(2,'0')}:00`;
    hoursCol.appendChild(lbl);
  }
  body.appendChild(hoursCol);

  // day columns
  for (let i=0; i<7; i++) {
    const day = addDays(currentWeekStart, i);
    const dayStr = dateToStr(day);
    const col = document.createElement('div');
    col.className = 'cal-day-col' + (isToday(day) ? ' is-today' : '');

    // slots
    for (let h=HOUR_START; h<HOUR_END; h++) {
      const slot = document.createElement('div');
      slot.className = 'cal-slot half-mark';
      slot.dataset.date = dayStr;
      slot.dataset.hour = h;
      slot.addEventListener('click', (e) => {
        if (e.target.closest('.interview-card')) return;
        closeDetailPopup();
        openModal(dayStr, `${String(h).padStart(2,'0')}:00`);
      });
      col.appendChild(slot);
    }

    // interview cards — cu layout overlap
    const dayInterviews = interviews.filter(iv => iv.data === dayStr);
    const layout = computeOverlapLayout(dayInterviews);
    for (const iv of dayInterviews) {
      const card = renderInterviewCard(iv, layout.get(iv.id));
      col.appendChild(card);
    }

    // current time line (only for today)
    if (isToday(day)) {
      const now = new Date();
      const totalMinutes = now.getHours()*60 + now.getMinutes();
      const startMinutes = HOUR_START * 60;
      const endMinutes   = HOUR_END   * 60;
      if (totalMinutes >= startMinutes && totalMinutes <= endMinutes) {
        const topPx = ((totalMinutes - startMinutes) / 60) * HOUR_PX;
        const line = document.createElement('div');
        line.className = 'current-time-line';
        line.style.top = topPx + 'px';
        col.appendChild(line);
      }
    }

    body.appendChild(col);
  }
  container.appendChild(body);
  updateWeekLabel();
}

function timeToMin(ora) {
  const [h, m] = ora.split(':').map(Number);
  return h * 60 + m;
}

function computeOverlapLayout(dayInterviews) {
  // Grupeaza interviurile care se suprapun in timp
  // Fiecare grup primeste aceeasi latime impartita egal
  const sorted = [...dayInterviews].sort((a, b) => a.ora.localeCompare(b.ora));
  const layout = new Map(); // id -> { col, total }

  // Construim coloane: fiecare interviu merge in prima coloana libera
  // unde nu se suprapune cu nimic existent
  const columns = []; // columns[i] = ultimul end-minute din coloana i

  // Pasul 1: asignam fiecare interviu la o coloana
  const assigned = new Map(); // id -> colIndex
  for (const iv of sorted) {
    const start = timeToMin(iv.ora);
    const end   = start + (iv.durata || 60);
    let placed  = false;
    for (let c = 0; c < columns.length; c++) {
      if (columns[c] <= start) {
        columns[c] = end;
        assigned.set(iv.id, c);
        placed = true;
        break;
      }
    }
    if (!placed) {
      assigned.set(iv.id, columns.length);
      columns.push(end);
    }
  }

  // Pasul 2: pentru fiecare interviu, gasim cate coloane are grupul sau
  // (toate interviurile care se suprapun cu el, direct sau indirect)
  // Simplu: parcurgem si vedem care e numarul maxim de coloane simultane
  // intr-o fereastra de timp
  for (const iv of sorted) {
    const start = timeToMin(iv.ora);
    const end   = start + (iv.durata || 60);
    // cate interviuri se suprapun cu acesta (inclusiv el)?
    const concurrent = sorted.filter(other => {
      const os = timeToMin(other.ora);
      const oe = os + (other.durata || 60);
      return os < end && oe > start;
    });
    const maxCol = Math.max(...concurrent.map(o => assigned.get(o.id))) + 1;
    layout.set(iv.id, { col: assigned.get(iv.id), total: maxCol });
  }

  return layout;
}

function renderInterviewCard(iv, pos) {
  const col   = pos ? pos.col   : 0;
  const total = pos ? pos.total : 1;

  const startMin = timeToMin(iv.ora);
  const topPx    = ((startMin - HOUR_START*60) / 60) * HOUR_PX;
  const heightPx = Math.max(28, ((iv.durata||60) / 60) * HOUR_PX - 3);

  // Latime si offset orizontal in functie de overlap
  const GAP      = 3;  // px intre carduri
  const colW     = `calc(${100/total}% - ${GAP}px)`;
  const colLeft  = `calc(${col * (100/total)}% + ${col > 0 ? GAP/2 : GAP/2}px)`;

  const card = document.createElement('div');
  card.className = `interview-card status-${iv.status}`;
  card.style.top    = topPx + 'px';
  card.style.height = heightPx + 'px';
  card.style.left   = colLeft;
  card.style.right  = 'auto';
  card.style.width  = colW;
  card.innerHTML = `
    <div class="card-time">${iv.ora}</div>
    <div class="card-name">${iv.candidate_name}</div>
    ${heightPx > 44 ? `<div class="card-job">${iv.job_title}</div>` : ''}
  `;
  card.addEventListener('click', (e) => { e.stopPropagation(); showDetailPopup(iv, e); });
  return card;
}

// ── WEEK LABEL ──
function updateWeekLabel() {
  const end = addDays(currentWeekStart, 6);
  const s = currentWeekStart;
  const e = end;
  let label;
  if (s.getMonth() === e.getMonth()) {
    label = `${s.getDate()} – ${e.getDate()} ${MONTHS_SHORT[s.getMonth()]} ${s.getFullYear()}`;
  } else {
    label = `${s.getDate()} ${MONTHS_SHORT[s.getMonth()]} – ${e.getDate()} ${MONTHS_SHORT[e.getMonth()]} ${s.getFullYear()}`;
  }
  document.getElementById('week-label').textContent = label;
  document.getElementById('topbar-sub').textContent =
    `Săptămâna ${s.getDate()} – ${e.getDate()} ${MONTHS_SHORT[s.getMonth()]} ${s.getFullYear()}`;
}

// ── FETCH INTERVIEWS ──
async function fetchInterviews() {
  const startStr = dateToStr(currentWeekStart);
  try {
    const res  = await fetch(`/calendar/api/week?start=${startStr}`);
    interviews = await res.json();
    renderCalendar();
  } catch(e) {
    console.error('Eroare fetch interviuri:', e);
    interviews = [];
    renderCalendar();
  }
}

// ── NAVIGATION ──
function changeWeek(dir) {
  currentWeekStart = addDays(currentWeekStart, dir * 7);
  fetchInterviews();
}
function goToday() {
  currentWeekStart = getMonday(new Date());
  fetchInterviews();
}

// ── MODAL ──
function openModal(date, time) {
  const overlay = document.getElementById('modal-overlay');

  // Reset
  document.getElementById('input-locatie').value = '';
  document.getElementById('input-durata').value  = '60';
  document.getElementById('btn-save').disabled   = false;
  document.getElementById('btn-save').textContent = 'Salvează & trimite email';

  // Data si ora din slot
  if (date) document.getElementById('input-data').value = date;
  else {
    const today = dateToStr(new Date());
    document.getElementById('input-data').value = today;
  }
  if (time) document.getElementById('input-ora').value = time;
  else document.getElementById('input-ora').value = '09:00';

  // Candidat preselectat
  if (preselectedCandidate) {
    document.getElementById('candidate-search').value    = preselectedCandidate.name;
    document.getElementById('selected-candidate-id').value = preselectedCandidate.id;
    document.getElementById('candidate-search').readOnly = true;
    document.getElementById('modal-sub').textContent =
      `Interviu pentru ${preselectedCandidate.name} — ${preselectedCandidate.job_title || ''}`;
  } else {
    document.getElementById('candidate-search').value    = '';
    document.getElementById('selected-candidate-id').value = '';
    document.getElementById('candidate-search').readOnly = false;
    document.getElementById('modal-sub').textContent =
      'Completează detaliile și salvează. Email-ul va fi trimis automat.';
  }
  document.getElementById('candidate-dropdown').style.display = 'none';
  overlay.classList.add('visible');
}
function closeModal() {
  document.getElementById('modal-overlay').classList.remove('visible');
  document.getElementById('candidate-dropdown').style.display = 'none';
}
function handleOverlayClick(e) {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
}

// ── CANDIDATE SEARCH ──
async function onCandidateSearch(q) {
  document.getElementById('selected-candidate-id').value = '';
  clearTimeout(searchTimeout);
  if (q.length < 2) {
    document.getElementById('candidate-dropdown').style.display = 'none';
    return;
  }
  searchTimeout = setTimeout(async () => {
    try {
      const res  = await fetch(`/calendar/api/candidati-search?q=${encodeURIComponent(q)}`);
      const list = await res.json();
      renderCandidateDropdown(list);
    } catch(e) {}
  }, 250);
}
function renderCandidateDropdown(list) {
  const dd = document.getElementById('candidate-dropdown');
  if (!list.length) { dd.style.display = 'none'; return; }
  dd.innerHTML = list.map(c => `
    <div class="candidate-option" onclick="selectCandidate(${c.id}, ${JSON.stringify(c.name)}, ${JSON.stringify(c.job_title)})">
      ${c.name}
      <div class="opt-job">${c.job_title || c.email}</div>
    </div>
  `).join('');
  dd.style.display = 'block';
}
function selectCandidate(id, name, job) {
  document.getElementById('candidate-search').value       = name;
  document.getElementById('selected-candidate-id').value  = id;
  document.getElementById('candidate-dropdown').style.display = 'none';
}
document.addEventListener('click', (e) => {
  if (!e.target.closest('.candidate-search-wrap'))
    document.getElementById('candidate-dropdown').style.display = 'none';
});

// ── SAVE INTERVIEW ──
async function saveInterview() {
  const candidateId = document.getElementById('selected-candidate-id').value;
  const data        = document.getElementById('input-data').value;
  const ora         = document.getElementById('input-ora').value;
  const locatie     = document.getElementById('input-locatie').value;
  const durata      = document.getElementById('input-durata').value;

  if (!candidateId) { showToast('Selectează un candidat.', true); return; }
  if (!data)         { showToast('Alege o dată.', true); return; }
  if (!ora)          { showToast('Alege o oră.', true); return; }

  const btn = document.getElementById('btn-save');
  btn.disabled    = true;
  btn.textContent = 'Se salvează...';

  const form = new FormData();
  form.append('candidate_id', candidateId);
  form.append('data', data);
  form.append('ora', ora);
  form.append('locatie', locatie);
  form.append('durata', durata);

  try {
    const res  = await fetch('/calendar/api/interview', { method: 'POST', body: form });
    const json = await res.json();
    if (json.success) {
      interviews.push(json.interview);
      renderCalendar();
      closeModal();
      showToast('Interviu programat! Email-ul va fi trimis candidatului.');
      preselectedCandidate = null;
    } else {
      showToast(json.error || 'Eroare la salvare.', true);
      btn.disabled = false;
      btn.textContent = 'Salvează & trimite email';
    }
  } catch(e) {
    showToast('Eroare de conexiune.', true);
    btn.disabled = false;
    btn.textContent = 'Salvează & trimite email';
  }
}

// ── DETAIL POPUP ──
function showDetailPopup(iv, e) {
  selectedInterview = iv;
  const popup = document.getElementById('detail-popup');
  document.getElementById('dp-name').textContent    = iv.candidate_name;
  document.getElementById('dp-job').textContent     = iv.job_title;
  document.getElementById('dp-data').textContent    = formatDateRo(iv.data);
  document.getElementById('dp-ora').textContent     = `${iv.ora} (${iv.durata || 60} min)`;
  document.getElementById('dp-link').href           = `/candidat/${iv.candidate_id}`;
  if (iv.locatie) {
    document.getElementById('dp-locatie').textContent = iv.locatie;
    document.getElementById('dp-locatie-row').style.display = 'flex';
  } else {
    document.getElementById('dp-locatie-row').style.display = 'none';
  }

  // Pozitionare popup langa card
  const rect = e.currentTarget.getBoundingClientRect();
  const vw   = window.innerWidth;
  popup.style.display = 'block';
  const pw = popup.offsetWidth;
  let left = rect.right + 10;
  if (left + pw > vw - 16) left = rect.left - pw - 10;
  popup.style.left = Math.max(8, left) + 'px';
  popup.style.top  = Math.min(rect.top, window.innerHeight - popup.offsetHeight - 16) + 'px';
  popup.classList.add('visible');
}
function closeDetailPopup() {
  document.getElementById('detail-popup').classList.remove('visible');
  selectedInterview = null;
}
document.addEventListener('click', (e) => {
  if (!e.target.closest('.detail-popup') && !e.target.closest('.interview-card'))
    closeDetailPopup();
});

// ── DELETE INTERVIEW ──
async function deleteInterview() {
  if (!selectedInterview) return;
  if (!confirm(`Ștergi interviul cu ${selectedInterview.candidate_name}?`)) return;
  try {
    const res  = await fetch(`/calendar/api/interview/${selectedInterview.id}/sterge`, { method: 'POST' });
    const json = await res.json();
    if (json.success) {
      interviews = interviews.filter(iv => iv.id !== selectedInterview.id);
      renderCalendar();
      closeDetailPopup();
      showToast('Interviul a fost șters.');
    }
  } catch(e) {
    showToast('Eroare la ștergere.', true);
  }
}

// ── TOAST ──
function showToast(msg, error) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className   = 'toast visible' + (error ? ' error' : '');
  setTimeout(() => t.className = 'toast', 3000);
}

// ── KEYBOARD ──
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { closeModal(); closeDetailPopup(); }
});

// ── INIT ──
window.addEventListener('DOMContentLoaded', () => {
  fetchInterviews();
  // Daca avem candidat preselectat, deschidem modalul dupa render
  if (preselectedCandidate) {
    setTimeout(() => openModal(), 400);
  }
  // Refresh current time line la fiecare minut
  setInterval(() => renderCalendar(), 60000);
});

;(function(){
if(window.innerWidth>768)return;
var DA=['Lun','Mar','Mie','Joi','Vin','Sam','Dum'];
function ds(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function isTod(d){var n=new Date();return d.getDate()===n.getDate()&&d.getMonth()===n.getMonth()&&d.getFullYear()===n.getFullYear()}
function addD(d,n){var r=new Date(d);r.setDate(r.getDate()+n);return r}
function getMon(d){var r=new Date(d);var dy=r.getDay();r.setDate(r.getDate()+(dy===0?-6:1-dy));r.setHours(0,0,0,0);return r}
var selDay=ds(new Date());
var wkStart=getMon(new Date());
var ivData=[];
var wrap=null;
function buildWrap(cont){
  if(wrap&&wrap.parentNode===cont)return;
  wrap=document.createElement('div');wrap.className='mcal-wrap';
  cont.appendChild(wrap);
}
function renderStrip(){
  if(!wrap)return;
  var strip=wrap.querySelector('.mcal-strip');
  if(!strip){strip=document.createElement('div');strip.className='mcal-strip';wrap.insertBefore(strip,wrap.firstChild);}
  strip.innerHTML='';
  for(var i=0;i<7;i++){
    var day=addD(wkStart,i);var dayStr=ds(day);
    var hasIv=ivData.some(function(iv){return iv.data===dayStr;});
    var btn=document.createElement('div');
    btn.className='mcal-day'+(isTod(day)?' tod':'')+(dayStr===selDay?' sel':'')+(hasIv?' hasiv':'');
    btn.innerHTML='<div class="mcal-dn">'+DA[i]+'</div><div class="mcal-dd">'+day.getDate()+'</div><div class="mcal-dot"></div>';
    (function(s){btn.onclick=function(){selDay=s;renderStrip();renderDay();};})(dayStr);
    strip.appendChild(btn);
  }
}
function renderDay(){
  if(!wrap)return;
  var dv=wrap.querySelector('.mcal-dv');
  if(!dv){dv=document.createElement('div');dv.className='mcal-dv';wrap.appendChild(dv);}
  var dayIvs=ivData.filter(function(iv){return iv.data===selDay;}).sort(function(a,b){return a.ora.localeCompare(b.ora);});
  if(!dayIvs.length){dv.innerHTML='<div class="mcal-empty"><p>Niciun interviu programat</p><small>Apasa + pentru a programa</small></div>';return;}
  dv.innerHTML='';
  dayIvs.forEach(function(iv){
    var card=document.createElement('div');card.className='mcal-iv';
    card.innerHTML='<div class="mcal-iv-tc"><div class="mcal-iv-t">'+iv.ora+'</div><div class="mcal-iv-d">'+(iv.durata||60)+'min</div><div class="mcal-iv-vl"></div></div>'
      +'<div class="mcal-iv-dot '+(iv.status==='finalizat'?'dot-f':'dot-a')+'"></div>'
      +'<div class="mcal-iv-info"><div class="mcal-iv-nm">'+(iv.candidate_name||'&mdash;')+'</div>'
      +'<div class="mcal-iv-jb">'+(iv.job_title||'&mdash;')+'</div>'
      +(iv.locatie?'<div class="mcal-iv-lc">&#128205; '+iv.locatie+'</div>':'')+'</div>';
    if(typeof showDetailPopup==='function'){
      (function(v){card.onclick=function(){showDetailPopup(v,{currentTarget:card});};})(iv);
    }
    dv.appendChild(card);
  });
}
function fetchMob(){
  var startStr=ds(wkStart);
  fetch('/calendar/api/week?start='+startStr)
    .then(function(r){return r.json();})
    .then(function(data){ivData=data;renderStrip();renderDay();})
    .catch(function(){renderStrip();renderDay();});
}
document.addEventListener('DOMContentLoaded',function(){
  var cont=document.getElementById('cal-container');
  if(!cont)return;
  document.querySelectorAll('.btn-nav').forEach(function(btn){
    btn.addEventListener('click',function(){
      setTimeout(function(){if(typeof currentWeekStart!=='undefined')wkStart=new Date(currentWeekStart);fetchMob();},80);
    });
  });
  document.querySelectorAll('.btn-today').forEach(function(btn){
    btn.addEventListener('click',function(){
      setTimeout(function(){selDay=ds(new Date());wkStart=getMon(new Date());fetchMob();},80);
    });
  });
  buildWrap(cont);renderStrip();renderDay();
  var obs=new MutationObserver(function(){
    if(!wrap||!wrap.parentNode){buildWrap(cont);renderStrip();renderDay();}
  });
  obs.observe(cont,{childList:true,subtree:false});
  fetchMob();
});
})();

</script>
