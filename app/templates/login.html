<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | NEXAS HR</title>

    <style>
        *{margin:0;padding:0;box-sizing:border-box}

        body{
            min-height:100vh;
            background:#050914;
            color:white;
            font-family:Arial,sans-serif;
            overflow-x:hidden;
        }

        .bg{
            position:fixed;
            inset:0;
            background:
                radial-gradient(circle at top right,rgba(139,92,246,.32),transparent 36%),
                radial-gradient(circle at bottom left,rgba(37,99,235,.22),transparent 34%),
                linear-gradient(135deg,#050914 0%,#080d1a 52%,#120b2b 100%);
            pointer-events:none;
            z-index:0;
        }

        .login-page{
            position:relative;
            z-index:1;
            min-height:100vh;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:flex-start;
            padding:44px 22px 70px;
        }

        .hero-logo{
            width:min(1180px,94vw);
            margin:0 auto 34px;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .hero-logo img{
            width:100%;
            max-height:300px;
            object-fit:cover;
            object-position:center;
            border-radius:30px;
            border:1px solid rgba(255,255,255,.12);
            box-shadow:0 35px 120px rgba(0,0,0,.58);
            display:block;
        }

        .card{
            width:min(460px,100%);
            background:rgba(15,23,42,.94);
            border:1px solid rgba(255,255,255,.09);
            border-radius:32px;
            padding:38px;
            box-shadow:0 30px 100px rgba(0,0,0,.48);
            position:relative;
            overflow:hidden;
        }

        .card:before{
            content:"";
            position:absolute;
            inset:0;
            background:radial-gradient(circle at top right,rgba(139,92,246,.22),transparent 42%);
            pointer-events:none;
        }

        .logo{
            font-size:44px;
            font-weight:950;
            line-height:1;
            margin-bottom:12px;
            position:relative;
            letter-spacing:-1px;
        }

        .logo span{color:#a78bfa}

        .subtitle{
            color:#94a3b8;
            line-height:1.5;
            margin-bottom:30px;
            position:relative;
            font-size:14px;
        }

        .field{
            display:grid;
            gap:8px;
            margin-bottom:16px;
            position:relative;
        }

        label{
            color:#a78bfa;
            text-transform:uppercase;
            font-size:12px;
            letter-spacing:.08em;
            font-weight:800;
        }

        input{
            width:100%;
            background:#020817;
            border:1px solid rgba(255,255,255,.12);
            color:white;
            padding:16px;
            border-radius:16px;
            font-size:16px;
        }

        input:focus{
            outline:none;
            border-color:#8b5cf6;
            box-shadow:0 0 0 3px rgba(139,92,246,.18);
        }

        button{
            width:100%;
            border:0;
            background:#8b5cf6;
            color:white;
            border-radius:16px;
            padding:17px;
            font-weight:900;
            font-size:16px;
            cursor:pointer;
            margin-top:8px;
            position:relative;
        }

        button:hover{background:#9568ff}

        .error{
            background:#7f1d1d;
            color:#fecaca;
            padding:14px;
            border-radius:14px;
            margin-bottom:18px;
            font-weight:700;
            position:relative;
        }

        .note{
            color:#64748b;
            font-size:13px;
            line-height:1.5;
            margin-top:20px;
            position:relative;
            text-align:center;
        }

        @media(max-width:760px){
            .login-page{
                padding:24px 16px 44px;
            }

            .hero-logo{
                width:100%;
                margin-bottom:24px;
            }

            .hero-logo img{
                max-height:190px;
                border-radius:22px;
            }

            .card{
                padding:30px 22px;
                border-radius:26px;
            }

            .logo{
                font-size:36px;
            }
        }
    </style>
</head>

<body>
<div class="bg"></div>

<main class="login-page">
    <div class="hero-logo">
        <img src="/static/images/LOGO%20NEXAS.jpg" alt="NEXAS HR Platform">
    </div>

    <form class="card" method="post" action="/login">
        <div class="logo">NEXAS <span>HR</span></div>
        <div class="subtitle">Platforma AI pentru analiza CV-urilor si potrivirea candidatilor cu rolurile disponibile.</div>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <div class="field">
            <label>User</label>
            <input type="text" name="username" placeholder="admin" autocomplete="username" required>
        </div>

        <div class="field">
            <label>Parola</label>
            <input type="password" name="password" placeholder="Parola" autocomplete="current-password" required>
        </div>

        <button type="submit">Intra in aplicatie</button>

        <div class="note">NEXAS HR Platform</div>
    </form>
</main>
</body>
</html>
